spring:
  application:
    name: alphaq-gaming

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/alphaq_gaming?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:alphaq}
    password: ${DB_PASSWORD:alphaq_dev_pw}

  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ---- Application settings (safe defaults for local dev) ---------------------
alphaq:
  cors:
    # "*" = any origin (dev-friendly). Lock this to real domains in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    # Dev-only secret. Override in production via APP_JWT_SECRET (>= 32 bytes).
    secret: ${APP_JWT_SECRET:alphaq-dev-secret-change-me-please-32bytes-min}
    ttl-minutes: ${APP_JWT_TTL_MINUTES:720}
  otp:
    length: 6
    ttl-seconds: 300            # OTP valid for 5 minutes (blueprint hold window)
    max-attempts: 5             # wrong-code attempts before invalidation
    resend-cooldown-seconds: 30
    max-per-hour: 6             # requests per mobile per hour
    # 'mock' (console + dev auto-fill) or 'msg91' (real SMS). Switch via env.
    provider: ${OTP_PROVIDER:mock}
    # DEV ONLY — return the OTP in the API response so the UI auto-fills it.
    # Set false (or use a real provider) in any shared/production environment.
    expose-in-response: ${OTP_EXPOSE_IN_RESPONSE:true}
    # Real SMS via MSG91 — used only when provider=msg91. Secrets come from env.
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
      sender-id: ${MSG91_SENDER_ID:ALPHAQ}
    # Real SMS via TextBee (Android-phone gateway) — used only when provider=textbee.
    textbee:
      api-key: ${TEXTBEE_API_KEY:}
      device-id: ${TEXTBEE_DEVICE_ID:}
      base-url: ${TEXTBEE_BASE_URL:https://api.textbee.dev/api/v1}
      default-country-code: ${TEXTBEE_COUNTRY_CODE:91}
      sim-subscription-id: ${TEXTBEE_SIM_ID:-1}   # -1 = phone default; set to your SIM slot id

logging:
  level:
    org.flywaydb: info
