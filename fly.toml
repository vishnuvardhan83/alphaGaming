# fly.toml app configuration file for AlphaQ Gaming Backend (Root workspace)
# Deploy directly from root with: fly deploy --config fly.toml
# Or from server/ with: cd server && fly deploy

app = "<FLY_APP_NAME>"
primary_region = "bom"

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  HOST = "0.0.0.0"
  DB_CLIENT = "mysql"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
